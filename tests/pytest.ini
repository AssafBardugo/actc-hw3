[pytest]
testpaths = .
norecursedirs = __pycache__ old .venv venv
python_files = phase*_test*.py
markers =
    phase1: Phase 1 - control plane & desired state
    phase2: Phase 2 - runtime & pod execution
    phase3: Phase 3 - networking & services
    phase4: Phase 4 - ReplicaSets & self-healing
    phase5: Phase 5 - stability & polish (optional)
    unit: Unit-level tests (no HTTP server or real Podman)
    integration: Cross-component tests (controllers + store + optional mocked runtime)
    e2e: Full-system tests that rely on real Podman and networking
    podman: Tests that require Podman installed and available on PATH
